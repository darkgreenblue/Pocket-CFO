services:
  bot:
    build: .
    image: pocket-cfo:latest
    container_name: pocket-cfo
    restart: unless-stopped
    env_file: .env
    environment:
      # دیتابیس روی volume پایدار؛ جدا از مسیر data/ که seed تگ‌ها داخل آن baked شده.
      - DB_PATH=/app/var/pocket_cfo.db
      # ویسِ صف‌شده‌ی میان‌بر هم روی همان volume می‌ماند تا با ری‌استارت گم نشود.
      - INGEST_AUDIO_DIR=/app/var/ingest_audio
      # ورک‌فلوی دیپلوی این را از روی هاستِ سرور می‌سازد و در .deploy.env می‌گذارد؛
      # خالی‌بودنش یعنی درِ دومِ ورودی خاموش است (مثلاً در اجرای محلی).
      - INGEST_PUBLIC_URL=${INGEST_PUBLIC_URL:-}
    # ⚠️ انتشارِ پورتِ ۸۷۹۱ عمداً اینجا نیست — در docker-compose.ingest.yml است و فقط
    # وقتی اضافه می‌شود که پورت واقعاً آزاد باشد. اگر اینجا می‌ماند، یک پورتِ گرفته‌شده
    # می‌توانست کلِ ربات را پایین نگه دارد؛ و ثبتِ خرج از تلگرام مهم‌تر از میان‌بر است.
    volumes:
      - pocketcfo-data:/app/var

volumes:
  pocketcfo-data:
