name: Deploy

on:
  push:
    branches:
      - claude/festive-meitner-zex34x
  workflow_dispatch:

# دیپلوی‌ها را سریالی نگه می‌داریم تا روی هم سوار نشوند
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # image را اینجا (با رم فراوان) می‌سازیم تا سرور ۱ گیگی هیچ‌وقت build نکند.
      - name: Build image
        run: docker build -t pocket-cfo:latest .

      - name: Save image (gzip)
        run: docker save pocket-cfo:latest | gzip > image.tar.gz

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy compose + image to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "${SSH_PORT:-22}" -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "mkdir -p ~/pocket-cfo"
          scp -P "${SSH_PORT:-22}" -i ~/.ssh/id_deploy \
            docker-compose.yml image.tar.gz "$SSH_USER@$SSH_HOST:~/pocket-cfo/"

      - name: Load image & restart container
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "${SSH_PORT:-22}" -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" '
            set -e
            cd ~/pocket-cfo
            docker load -i image.tar.gz
            docker compose up -d
            rm -f image.tar.gz
            docker image prune -f
          '
