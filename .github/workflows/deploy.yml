name: Deploy

on:
  push:
    branches:
      - claude/festive-meitner-zex34x
  workflow_dispatch:

# دیپلوی‌ها را سریالی نگه می‌داریم تا روی هم سوار نشوند
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # image را اینجا (با رم فراوان) می‌سازیم تا سرور ۱ گیگی هیچ‌وقت build نکند.
      - name: Build image
        run: docker build -t pocket-cfo:latest .

      - name: Save image (gzip)
        run: docker save pocket-cfo:latest | gzip > image.tar.gz

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy compose + image to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "${SSH_PORT:-22}" -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "mkdir -p ~/pocket-cfo"
          scp -P "${SSH_PORT:-22}" -i ~/.ssh/id_deploy \
            docker-compose.yml docker-compose.ingest.yml image.tar.gz \
            "$SSH_USER@$SSH_HOST:~/pocket-cfo/"

      - name: Load image & restart container
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          # آدرسی که گوشیِ کاربر برای میان‌برِ iOS صدا می‌زند. پیش‌فرض از همان هاستِ
          # دیپلوی ساخته می‌شود تا کسی لازم نباشد دستی چیزی به .env سرور اضافه کند.
          # اگر روزی Cloudflare/دامنه جلویش آمد، یک Variable به همین نام در گیت‌هاب
          # بساز (Settings → Secrets and variables → Actions → Variables) و همان برنده است.
          INGEST_PUBLIC_URL: ${{ vars.INGEST_PUBLIC_URL || format('http://{0}:8081', secrets.SSH_HOST) }}
        run: |
          # تنظیماتِ تولیدشده‌ی دیپلوی، جدا از .envِ دست‌سازِ سرور تا با هم قاطی نشوند.
          # (اینجا داخل کوتیشنِ دوتایی است تا مقدار سمتِ لوکال جایگزین شود.)
          ssh -p "${SSH_PORT:-22}" -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            "mkdir -p ~/pocket-cfo && printf 'INGEST_PUBLIC_URL=%s\n' '$INGEST_PUBLIC_URL' > ~/pocket-cfo/.deploy.env"

          ssh -p "${SSH_PORT:-22}" -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" '
            set -e
            cd ~/pocket-cfo
            docker load -i image.tar.gz
            set -a; . ./.deploy.env; set +a

            # اول کانتینرِ قبلی را ببند تا bindهای خودمانِ قبلی آزاد شوند.
            docker compose down --remove-orphans || true

            # فقط اگر ufw فعال باشد؛ فایروالِ ابریِ ارائه‌دهنده از اینجا قابلِ تنظیم نیست.
            if command -v ufw >/dev/null && ufw status 2>/dev/null | grep -q "Status: active"; then
              ufw allow 8081/tcp >/dev/null 2>&1 || true
            fi

            # با درِ دومِ ورودی تلاش می‌کنیم؛ اگر پورت گرفته بود، بدونِ آن بالا می‌آییم.
            # عمداً پورت را از قبل «پروب» نمی‌کنیم: ss/netstat ممکن است روی سرور نباشند
            # و آن‌وقت پروب بی‌صدا «آزاد» می‌گوید و همین‌جا می‌ترکد. تلاشِ واقعی دروغ نمی‌گوید.
            if docker compose -f docker-compose.yml -f docker-compose.ingest.yml up -d; then
              echo "درِ دومِ ورودی روی ۸۰۸۱ فعال است."
            else
              echo "::warning::پورت ۸۰۸۱ در دسترس نبود — ربات بدون درِ دومِ ورودی بالا می‌آید (میان‌برِ iOS کار نمی‌کند)."
              docker ps --format "{{.Names}} → {{.Ports}}"
              docker compose -f docker-compose.yml up -d
            fi

            rm -f image.tar.gz
            docker image prune -f
            docker compose ps
          '
