# لایه‌ی اختیاریِ «درِ دومِ ورودی» (میان‌برِ iOS).
#
# جدا از docker-compose.yml است تا انتشارِ پورت یک تصمیمِ زمانِ دیپلوی باشد، نه یک
# شرطِ لازم برای بالاآمدنِ ربات. اگر پورتِ ۸۷۹۱ روی سرور گرفته باشد، دیپلوی این فایل
# را کنار می‌گذارد و ربات — که کارِ اصلی‌اش ثبتِ خرج از تلگرام است — سالم بالا می‌آید.
#
# استفاده:  docker compose -f docker-compose.yml -f docker-compose.ingest.yml up -d
services:
  bot:
    ports:
      - "8791:8791"
